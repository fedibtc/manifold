[package]
name = "defe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
defe-api = { path = "../defe-api" }
defe-portalloc = { path = "../defe-portalloc" }
fedi-decentralized-manifold-environment = { path = "../manifold-environment" }
libc = "0.2"
listenfd = "1"
nostr = "0.44"
secp256k1 = "0.30"
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
