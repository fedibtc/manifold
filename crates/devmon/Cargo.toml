[package]
name = "devmon"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false
default-run = "devmon"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
fedi-credential-sdk-protocol.workspace = true
fedi-credential-sdk-schemas.workspace = true
fedi-decentralized-manifold-environment = { path = "../manifold-environment" }
fedi-decentralized-nostr = { version = "0.1.0", path = "../nostr" }
fedi-decentralized-nostr-clients = { path = "../nostr-clients" }
futures = "0.3.32"
nostr-sdk = "0.44.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.150"
serde_json_canonicalizer = "0.3"
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
