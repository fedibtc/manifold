[package]
name = "fedi-decentralized-service-fleet-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fedi-decentralized-services = { path = "../services" }
fedi-iroh-rpc = { path = "../fedi-iroh-rpc" }
hex = "0.4"
nostr = "0.44"
petname = { version = "=3.1.0", default-features = false, features = [
  "default-words",
] }
secp256k1 = { version = "0.30", features = ["global-context", "rand", "serde"] }
semver = "1"
serde = { workspace = true }
serde_bytes = "0.11"
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2.workspace = true
stability-pool-common = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
url = "2.5.7"
uuid = "1"

[dev-dependencies]
bitcoin = { version = "0.32.6", features = ["serde"] }
blind-rsa-signatures = "0.17"
ciborium.workspace = true
fedi-credential-sdk-protocol.workspace = true
iroh = { workspace = true }
nostr = "0.44"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
