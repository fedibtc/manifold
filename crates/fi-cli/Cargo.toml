[package]
name = "fi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
bitcoin_hashes = "0.14"
clap = { version = "4", features = ["derive"] }
fedi-decentralized-domain = { path = "../domain" }
fedi-decentralized-federation-preview = { path = "../federation-preview" }
fedi-decentralized-manifold-environment = { path = "../manifold-environment" }
fedi-decentralized-nostr-clients = { path = "../nostr-clients" }
fedi-decentralized-peer-badge-verifier = { path = "../peer-badge-verifier" }
fedi-decentralized-service-fleet-manager = { path = "../service-fleet-manager" }
fedi-decentralized-service-liquidity-manager = { path = "../service-liquidity-manager" }
fedimint-api-client = { workspace = true }
fedimint-client = { workspace = true }
fedimint-client-module = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-core = { workspace = true }
fedimint-derive-secret = { workspace = true }
fedimint-ln-client = { workspace = true }
fedimint-lnv2-client = { workspace = true }
fedimint-mint-client = { workspace = true }
fedimint-mint-common = { workspace = true }
fedimint-mintv2-client = { workspace = true }
fedimint-mintv2-common = { workspace = true }
fedimint-rocksdb = { workspace = true }
fedimint-tbs = { workspace = true }
fedimint-wallet-client = { workspace = true }
fedimint-walletv2-client = { workspace = true }
fi-client = { path = "../fi-client", features = ["dev-pinned-formation"] }
futures = "0.3"
hex = "0.4"
iroh.workspace = true
libc = "0.2"
lightning-invoice = "0.33.3"
locked-payments = { path = "../locked-payments" }
nostr-sdk = "0.44"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secp256k1 = { version = "0.30", features = ["rand"] }
serde.workspace = true
serde_json.workspace = true
stability-pool-client.workspace = true
stability-pool-common.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
bls12_381 = "0.8"
tempfile = "3"
