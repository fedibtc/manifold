fedimint-rocksdb = { path = "../../../.nix-deps/fedimint-0.13/fedimint-rocksdb" }
fedimint-server = { path = "../../../.nix-deps/fedimint-0.13/fedimint-server" }
fedimint-server-bitcoin-rpc = { path = "../../../.nix-deps/fedimint-0.13/fedimint-server-bitcoin-rpc" }
