version: "3.7"

services:
  app:
    # The image is built with Nix, not a Dockerfile, and bundles the
    # flake-pinned fedimintd:
    #   nix build .#fleet-manager-oci-image && docker load -i result
    # (or `nix run .#fleet-manager-container-load`), which loads
    # fleet-manager:0.1.0. The image sets FLEET_MANAGER_FEDIMINTD_PATH to the
    # bundled fedimintd, so it is not overridden here.
    image: fleet-manager:0.1.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      # Seat iroh UDP sockets (p2p and api of each 4-port seat block, base
      # 30000). Publishing them removes the container NAT layer so iroh can
      # hole-punch direct peer paths. Seat ordinals are lifetime-monotonic
      # (never reused after decommission), so this range covers the first 8
      # seats the host ever creates; a later ordinal's seat still works but
      # falls back to public relays until the range is extended. UDP only:
      # in iroh mode there is no TCP listener at the p2p port, and the api
      # port's WebSocket API (already public over iroh) is intentionally
      # left unpublished.
      - "30000-30031:30000-30031/udp"
    environment:
      FLEET_MANAGER_DATA_DIR: /data
      FLEET_MANAGER_MANIFOLD_ENVIRONMENT: production
      # Required deployment input. Configure the real public HTTPS gateway;
      # there is deliberately no localhost or example default.
      FLEET_MANAGER_PUSH_GATEWAY_ORIGIN: ${FLEET_MANAGER_PUSH_GATEWAY_ORIGIN}
      # Umbrel Bitcoin Core app assumptions. If Umbrel changes these names, adapt
      # this Compose file rather than changing fleet-manager CLI semantics.
      FLEET_MANAGER_BITCOIND_URL: http://${BITCOIN_IP:-bitcoin}:${BITCOIN_RPC_PORT:-8332}
      FLEET_MANAGER_BITCOIND_USERNAME: ${BITCOIN_RPC_USER}
      FLEET_MANAGER_BITCOIND_PASSWORD: ${BITCOIN_RPC_PASSWORD}
